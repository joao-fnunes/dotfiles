---
- name: Bootstrap system
  hosts: all

  tasks:
  - name: Install packages
    become: true
    package:
      state: latest
      name:
      - zsh
      - neovim
      - git
      - python3
      - python3-pygments
      - screen
      - reptyr
      - plocate
      - dnsutils
      - net-tools
      - tmux

  # Oh My Zsh (https://ohmyz.sh)
  - name: Get Oh My Zsh installation directory
    stat:
      path: "~/.oh-my-zsh"
    register: ohmyzsh_stat

  - name: Install Oh My Zsh
    block:
    - name: Download Oh My Zsh installation script
      get_url:
        url: https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: /tmp/install-ohmyzsh.sh
        mode: "0760"

    - name: Run Oh My Zsh installation script
      shell: /tmp/install-ohmyzsh.sh
    when: not ohmyzsh_stat.stat.exists

  # Powerlevel10k (https://github.com/romkatv/powerlevel10k)
  - name: Get Powerlevel10k installation directory
    stat:
      path: "~/.oh-my-zsh/custom/themes/powerlevel10k"
    register: p10k_stat

  - name: Install Powerlevel10k
    git:
      repo: https://github.com/romkatv/powerlevel10k.git
      dest: "~/.oh-my-zsh/custom/themes/powerlevel10k"
      depth: 1
    when: not p10k_stat.stat.exists

  # lazy.nvim (Neovim's plugin manager) requires Neovim >= 0.8. Some apt repos
  # (older Ubuntu) ship an older neovim; warn so the user can install a newer
  # source (unstable PPA or AppImage). Non-fatal.
  - name: Get Neovim version
    ansible.builtin.command: nvim --version
    register: nvim_version
    changed_when: false
    failed_when: false

  - name: Warn if Neovim is too old for lazy.nvim
    ansible.builtin.debug:
      msg: >-
        Neovim appears older than 0.8 ({{ nvim_version.stdout_lines[0] | default('unknown') }}).
        lazy.nvim requires >= 0.8 — install a newer neovim (unstable PPA or AppImage).
    when:
      - nvim_version.rc == 0
      - nvim_version.stdout is search('NVIM v0\.[0-7]\.')

  # Vundle (https://github.com/VundleVim/Vundle.vim) — plain vim only. Neovim
  # uses lazy.nvim, so Vundle plugins are installed with `vim`, and only when a
  # `vim` binary is actually present.
  - name: Check for a plain vim binary
    ansible.builtin.command: which vim
    register: vim_bin
    changed_when: false
    failed_when: false

  - name: Get Vundle installation directory
    stat:
      path: "~/.vim/bundle/Vundle.vim"
    register: vundle_stat

  - name: Install Vundle
    block:
      - name: Download Vundle repo
        git:
          repo: https://github.com/VundleVim/Vundle.vim.git
          dest: "~/.vim/bundle/Vundle.vim"
          depth: 1

      - name: Install Vundle plugins
        shell: vim +PluginInstall +qa
    when:
      - not vundle_stat.stat.exists
      - vim_bin.rc == 0

  # gdb-dashboard https://github.com/cyrus-and/gdb-dashboard
  - name: Get gdb-dashboard file
    stat:
      path: "~/.gdb-dashboard"
    register: gdbdashboard_stat

  - name: Install gdb-dashboard
    block:
    - name: Download gdb-dashboard
      get_url:
        url: https://raw.githubusercontent.com/cyrus-and/gdb-dashboard/master/.gdbinit
        dest: ~/.gdb-dashboard
        mode: "0664"
    when: not gdbdashboard_stat.stat.exists

- name: Set up zsh for user
  hosts: localhost
  become: no
  vars:
    the_user: "{{ ansible_user_id }}"
  tasks:
    - name: Change user shell to zsh
      become: yes
      user:
        name: "{{ the_user }}"
        shell: /bin/zsh
