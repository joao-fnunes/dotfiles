set -sg escape-time 10
set -g mouse on
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:osc7"
set-window-option -g mode-keys vi

set -g default-command "cd $(pwsh.exe -c 'Write-Host -NoNewLine \$env:userprofile' | xargs -0 wslpath); exec pwsh.exe --nologo"
set-window-option -g automatic-rename off
bind c new-window -c "#{pane_current_path}" -n "PowerShell" "exec pwsh.exe --nologo"
bind '"' split-window -v -c "#{pane_current_path}" "exec pwsh.exe --nologo"
bind % split-window -h -c "#{pane_current_path}" "exec pwsh.exe --nologo"

# Give this tmux a "PowerShell blue" color to differentiate it
set -g status-bg cyan

# Use UTF8
set -qg utf8
set-window-option -qg utf8 on

# Use Ctrl+Space as prefix instead of Ctrl+B
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
bind C-Space last-window

# Optional
# split panes using - and |
#bind | split-window -h -c "#{pane_current_path}" "exec pwsh.exe --nologo"
#bind - split-window -v -c "#{pane_current_path}" "exec pwsh.exe --nologo"
#unbind '"'
#unbind %

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 10000
