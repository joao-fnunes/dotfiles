# Load shared settings from base tmux config
source-file ~/.tmux.conf

# Compute WSL home path once at config load (avoids calling cmd.exe on every split)
run-shell 'tmux set-environment -g PWSH_WSL_HOME "$(wslpath "$(cmd.exe /c echo %USERPROFILE% 2>/dev/null | tr -d \\r)")"'

# Initial window starts in Windows user profile
set -g default-command 'cd "$PWSH_WSL_HOME"; exec pwsh.exe --nologo'
set-window-option -g automatic-rename off

# New panes/windows start in the last PowerShell CWD (written by profile.ps1)
bind c new-window -n "PowerShell" 'cd "$(cat "$PWSH_WSL_HOME/.tmux_pwsh_cwd" 2>/dev/null || echo "$PWSH_WSL_HOME")" && exec pwsh.exe --nologo'
bind '"' split-window -v 'cd "$(cat "$PWSH_WSL_HOME/.tmux_pwsh_cwd" 2>/dev/null || echo "$PWSH_WSL_HOME")" && exec pwsh.exe --nologo'
bind % split-window -h 'cd "$(cat "$PWSH_WSL_HOME/.tmux_pwsh_cwd" 2>/dev/null || echo "$PWSH_WSL_HOME")" && exec pwsh.exe --nologo'

# Give this tmux a "PowerShell blue" color to differentiate it
set -g status-bg cyan
