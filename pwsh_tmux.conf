# PowerShell tmux configuration for WSL.
#
# This config should run on a dedicated tmux server to keep its key bindings and
# global options isolated from regular (zsh/bash) tmux sessions.
#
# Usage:
#   tmux -L pwsh -f ~/.pwsh_tmux.conf          # new session
#   tmux -L pwsh attach                         # reattach

# Load shared settings from base tmux config
source-file ~/.tmux.conf

# Compute WSL home path once at config load (avoids calling cmd.exe on every split).
# Stored as both an env var (for shell commands) and a user option (for format strings).
run-shell 'p="$(wslpath "$(cmd.exe /c echo %USERPROFILE% 2>/dev/null | tr -d \\r)")"; tmux set-environment -g PWSH_WSL_HOME "$p"; tmux set-option -g @pwsh_wsl_home "$p"'

# Initial window starts in Windows user profile
set -g default-command 'cd "$PWSH_WSL_HOME"; export WSLENV="${WSLENV:+$WSLENV:}TMUX_PANE"; exec pwsh.exe --nologo'
set-window-option -g automatic-rename off

# New panes/windows open in the source pane's CWD (per-pane @pwsh_cwd set by profile.ps1).
# -c supports format expansion: #{@pwsh_cwd} resolves to the current pane's value.
bind c new-window -c "#{?#{@pwsh_cwd},#{@pwsh_cwd},#{@pwsh_wsl_home}}" -n "PowerShell" 'export WSLENV="${WSLENV:+$WSLENV:}TMUX_PANE"; exec pwsh.exe --nologo'
bind '"' split-window -v -c "#{?#{@pwsh_cwd},#{@pwsh_cwd},#{@pwsh_wsl_home}}" 'export WSLENV="${WSLENV:+$WSLENV:}TMUX_PANE"; exec pwsh.exe --nologo'
bind % split-window -h -c "#{?#{@pwsh_cwd},#{@pwsh_cwd},#{@pwsh_wsl_home}}" 'export WSLENV="${WSLENV:+$WSLENV:}TMUX_PANE"; exec pwsh.exe --nologo'

# Give this tmux a "PowerShell blue" color to differentiate it
set -g status-bg cyan
