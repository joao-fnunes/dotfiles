set -sg escape-time 10
set -g mouse on
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # enable 24-bit truecolor
set -g focus-events on
set-window-option -g mode-keys vi

# Use Ctrl+Space as prefix instead of Ctrl+B
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
bind C-Space last-window

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch panes using Alt+<VIM binding> without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# switch windows using Alt-n/Alt-p without prefix
bind -n M-n next-window
bind -n M-p previous-window

# faster zoom
bind -n M-z resize-pane -Z

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 10000

# ── New windows & panes open in the current pane's directory ───
# By default tmux opens new-window/split-window in the path the server was
# started from. Passing -c "#{pane_current_path}" makes them inherit the active
# pane's working directory. This resolves natively in both target environments:
#   • tmux on Linux/WSL — reads the pane process CWD from /proc
#   • psmux on Windows  — tracks the pane process CWD through the ConPTY tree
# (The dedicated pwsh -L server is the one exception: pwsh.exe runs as a Windows
#  process under WSL's tmux, so #{pane_current_path} can't see its CWD. That is
#  why pwsh_tmux.conf sources this file first, then overrides these three keys
#  with its own @pwsh_cwd tracker.)
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── Navigation & quality-of-life ───────────────────────────────
set -g renumber-windows on          # keep window numbers gap-free for prefix+<n> jumps
set -g allow-rename off             # stop programs renaming windows; keep names meaningful

# Reload this config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Repeatable pane resizing with prefix + Shift-h/j/k/l
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi-style selection in copy mode (v to select, y to yank)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status bar ─────────────────────────────────────────────────
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour236,fg=colour250"

# Left: session name in an accent block
set -g status-left-length 30
set -g status-left "#[bg=colour2,fg=colour16,bold] #S #[default] "

# Windows: dim when inactive, bold accent block when active; #I index always shown
set -g window-status-separator ""
set -g window-status-format         "#[fg=colour245] #I #[fg=colour250]#W "
set -g window-status-current-format "#[bg=colour2,fg=colour16,bold] #I #W#{?window_zoomed_flag, Z,} #[default]"

# NOTE: window activity monitoring is intentionally left off. With focus-events
# enabled, Powerlevel10k's transient prompt redraws when a window loses focus;
# tmux would flag that as "activity" and (with the default visual-activity off)
# ring the bell on every window switch. Leaving it off keeps switching silent.

# Right: PREFIX indicator (lights up after C-Space) + date/time
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=colour214#,fg=colour16#,bold] PREFIX #[default] ,}#[fg=colour245]%a %d %b #[fg=colour255,bold]%H:%M "

# Pane borders and prefix+q pane numbers share the accent colour
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour2"
set -g display-panes-active-colour colour2
set -g display-panes-colour colour245
set -g message-style "bg=colour2,fg=colour16,bold"
